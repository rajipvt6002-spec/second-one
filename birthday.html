<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Poppins', sans-serif;
    }

    body{
        height:100vh;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
    }

    .card{
        background:white;
        padding:40px;
        border-radius:20px;
        text-align:center;
        width:350px;
        box-shadow:0 15px 35px rgba(0,0,0,0.2);
        animation: float 4s ease-in-out infinite;
    }

    h1{
        color:#ff4b5c;
        margin-bottom:15px;
    }

    p{
        font-size:16px;
        color:#555;
        margin-bottom:20px;
    }

    button{
        padding:10px 20px;
        border:none;
        border-radius:30px;
        background:#ff4b5c;
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        background:#ff1e3c;
        transform:scale(1.1);
    }

    .hidden-message{
        margin-top:20px;
        display:none;
        font-weight:500;
        color:#ff4b5c;
        animation: fadeIn 2s ease forwards;
    }

    @keyframes float{
        0%{transform:translateY(0px);}
        50%{transform:translateY(-15px);}
        100%{transform:translateY(0px);}
    }

    @keyframes fadeIn{
        from{opacity:0;}
        to{opacity:1;}
    }

    .hearts{
        position:absolute;
        bottom:0;
        font-size:20px;
        animation: rise 5s linear infinite;
        color:#ff4b5c;
    }

    @keyframes rise{
        0%{transform:translateY(0); opacity:1;}
        100%{transform:translateY(-800px); opacity:0;}
    }
</style>
</head>
<body>

<div class="card">
    <h1>Hi My Love ❤️</h1>
    <p>You are the best thing that ever happened to me.  
    Thank you for being my happiness every day 💕</p>
    <button onclick="showMessage()">Click Me 💌</button>
    <div class="hidden-message" id="loveMessage">
        I love you more than words can say 💖 Forever yours.
    </div>
</div>

<script>
function showMessage(){
    document.getElementById("loveMessage").style.display="block";
}

// Floating hearts
setInterval(function(){
    var heart = document.createElement("div");
    heart.className = "hearts";
    heart.style.left = Math.random() * 100 + "vw";
    heart.innerHTML = "❤️";
    document.body.appendChild(heart);

    setTimeout(function(){
        heart.remove();
    },5000);
},500);
</script>

</body>
</html>
